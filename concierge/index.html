<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#055588">
<title>Mobile Concierge Registration · Divi Little Bay</title>
<style>
  :root {
    --blue: #0278b9;
    --navy: #055588;
    --pink: #ef5a93;
    --aqua: #7dcdcc;
    --ink: #1e2a32;
    --muted: #5c6b76;
    --line: #d5e2ee;
    --paper: #f3f7fb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Montserrat, "PT Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .appbar {
    background: var(--navy);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 20px;
    min-height: 78px;
  }
  .appbar img { width: 148px; height: auto; }
  .brand strong { display: block; font-size: 18px; letter-spacing: -0.02em; }
  .brand span { display: block; font-size: 13px; color: #d7ebf8; margin-top: 2px; }
  #nav { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .navbtn {
    background: transparent;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,.35);
    border-radius: 999px;
    min-height: 44px;
    padding: 8px 16px;
    font-weight: 700;
  }
  .navbtn.active { background: #fff; color: var(--navy); border-color: #fff; }
  .accent { height: 4px; background: var(--pink); }
  .page { padding: 18px 22px 32px; }
  h1 { margin: 0; font-size: 28px; color: var(--navy); letter-spacing: -0.03em; }
  h2 { margin: 14px 0 8px; font-size: 16px; color: var(--navy); }
  .sub, .meta { color: var(--muted); font-size: 13.5px; }
  .sub { margin: 4px 0 0; }
  .kicker { margin: 0; color: var(--blue); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
  .hrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
  .search { min-width: 280px; min-height: 48px; border-radius: 12px; border: 1.5px solid #c9d7e4; padding: 0 14px; background: #fff; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat {
    background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
    min-height: 64px; min-width: 120px; text-align: left; padding: 8px 12px; font-weight: 600; font-size: 13px; color: var(--muted);
  }
  .stat b { display: block; font-size: 22px; color: var(--navy); font-weight: 700; }
  .stat.on { border-color: var(--blue); background: #eaf6fc; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .gcard {
    display: block; width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--line);
    border-radius: 16px; padding: 14px; color: inherit;
  }
  .gcard:hover, .gcard:focus-visible { border-color: var(--blue); outline: none; }
  .grow { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .grow strong { font-size: 18px; color: var(--navy); }
  .room { font-weight: 700; color: var(--blue); }
  .gid { font-size: 13px; font-weight: 700; margin: 4px 0; }
  .prow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .pill { background: #eef3f7; color: var(--navy); border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
  .pill.aqua { background: #e5f7f7; color: #0e6e6c; }
  .pill.pink, .pill.hot { background: #fde7ef; color: #a3164e; }
  .footrow { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .count { color: var(--navy); }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .cols { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
  .bignum { font-size: 26px; font-weight: 700; color: var(--navy); margin: 4px 0; }
  .back { background: none; border: 0; color: var(--blue); font-weight: 700; padding: 0 0 8px; min-height: 40px; }
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .msg { background: #f5f9fc; border-radius: 12px; padding: 10px 12px; }
  .msg p { margin: 6px 0 0; }
  .msg .meta, .ch { font-size: 12px; color: var(--muted); font-weight: 700; }
  .msg .meta { display: flex; gap: 10px; flex-wrap: wrap; }
  .logged { color: var(--blue); }
  .composer { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg.col { flex-direction: column; }
  .seg label, .pick, .checkline {
    display: flex; align-items: center; gap: 8px; background: #f5f9fc; border: 1.5px solid var(--line);
    border-radius: 12px; min-height: 48px; padding: 8px 12px; font-weight: 700;
  }
  .seg label { flex: 1; justify-content: center; }
  .seg label:has(input:checked), .pick:has(input:checked) { border-color: var(--blue); background: #eaf6fc; color: var(--navy); }
  .tix { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
  .tix.hot { border-color: #f3b3cc; background: #fff7fa; }
  .subj { font-weight: 700; color: var(--navy); margin: 6px 0; word-break: break-word; }
  textarea { min-height: 72px; resize: vertical; }
  input, select, textarea {
    background: #fff; border: 1.5px solid #c9d7e4; border-radius: 12px; min-height: 48px; padding: 10px 12px; width: 100%;
  }
  input[type="checkbox"], input[type="radio"] {
    width: 20px; height: 20px; min-height: 0; padding: 0; flex: 0 0 auto; accent-color: #0278b9;
  }
  .f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--navy); margin: 8px 0; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .split select { width: auto; }
  .label { font-size: 13px; font-weight: 700; color: var(--navy); margin: 8px 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; min-height: 40px; padding: 6px 12px; font-weight: 700; color: var(--navy); }
  .tag.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .primary, .ghost { border-radius: 12px; min-height: 50px; padding: 12px 16px; font-weight: 700; }
  .primary { background: var(--blue); color: #fff; border: 0; }
  .primary:hover { background: var(--navy); }
  .ghost { background: #fff; color: var(--navy); border: 1.5px solid var(--line); }
  .err { color: #b4234a; font-weight: 700; min-height: 0; }
  .err:empty { display: none; }
  .banner { background: #fff4f7; color: #8d2454; border-radius: 12px; padding: 10px 12px; }
  .desk { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; }
  .folder {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    min-height: 52px; margin-bottom: 8px; border-radius: 12px; border: 1.5px solid var(--line);
    background: #fff; padding: 8px 12px; text-align: left; font-weight: 700; color: var(--navy);
  }
  .folder.on { border-color: var(--blue); background: #eaf6fc; }
  .folder .n { background: var(--navy); color: #fff; border-radius: 999px; min-width: 28px; text-align: center; padding: 2px 8px; }
  .folder.urg .n { background: var(--pink); }
  .folder.sm .n { background: #0e6e6c; }
  table.tickets { width: 100%; border-collapse: collapse; }
  table.tickets th { text-align: left; font-size: 12px; color: var(--muted); padding: 6px; }
  table.tickets td { padding: 10px 6px; border-top: 1px solid #e5eef5; vertical-align: top; }
  table.tickets select { min-height: 40px; }
  .catgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cattile { text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; min-height: 64px; padding: 8px 10px; }
  .cattile b { display: block; color: var(--blue); }
  .cattile.on { border-color: var(--blue); background: #eaf6fc; }
  .cattile.urg.on, .cattile.urg { background: #fff7fa; }
  .picks { display: flex; flex-direction: column; gap: 8px; }
  .success { display: grid; grid-template-columns: 1fr 240px; gap: 18px; align-items: center; }
  .success .hrow { justify-content: flex-start; }
  .success .meta { max-width: 220px; }
  #qr { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  #qr svg { width: 200px; height: 200px; display: block; }
  .digest { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--pink); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .empty { color: var(--muted); }
  .checkline { font-weight: 700; }
  @media (max-width: 1100px) {
    .cards, .formgrid, .cols, .desk, .success { grid-template-columns: 1fr; }
  }

  .hero { display: grid; grid-template-columns: 280px 1fr; background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
  .hero img { width: 100%; height: 168px; object-fit: cover; }
  .hero .copy { padding: 16px 18px 14px; }
  .hero .copy p { margin: 6px 0 0; color: var(--muted); }
  .hero.slim img { height: 132px; }
  .next { margin-top: 6px; font-size: 13.5px; color: var(--navy); }
  .next b { color: #0e6e6c; font-weight: 700; }
  .tiny { color: #8a96a0; font-weight: 600; }
  .ops { margin-top: 12px; background: #f4f6f8; border-radius: 12px; padding: 8px 10px; color: #6a7680; }
  .ops summary { cursor: pointer; font-weight: 700; color: #6a7680; }
  .opshead { margin: 14px 0 6px; color: #8a96a0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .muted-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .cattile.tiny { min-height: 40px; background: #f4f6f8; color: #5c6b76; font-size: 13px; flex: 1; }
  .folder.muted { background: #f7f8fa; color: #6a7680; }
  .folder.muted .n { background: #9aa6b0; }
  .seg.wrap label { flex: 0 1 auto; }
  div.stat { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; min-height: 64px; min-width: 120px; padding: 8px 12px; font-weight: 600; font-size: 13px; color: var(--muted); }

</style>
</head>

        ^ EXP_TABLE[i - 6]

      while (n < 0) {
        n += 255;

      while (n >= 256) {

function renderSales() {
  const today = todayISO();
  const house = db.guests.filter(g => inHouse(g, today));
  const hot = house.filter(g => g.hotLead);
  const owners = house.filter(g => g.ownerStatus === 'Owner');
  const upsells = [];
  house.forEach(g => (g.experiences || []).forEach(e => { if (e.status === 'Suggested') upsells.push({ g, e }); }));
  const rsvps = [];
  house.forEach(g => (g.experiences || []).forEach(e => { if (/Soirée|RSVP|Invited/.test(e.title + e.status)) rsvps.push({ g, e }); }));
  const celebrations = house.filter(celebrating);
  const counts = [
    [hot.length, 'Hot leads'],
    [owners.length, 'Owner interest'],
    [upsells.length, 'Upsells'],
    [rsvps.length, 'Event RSVPs'],
    [celebrations.length, 'Celebrations']
  ];
  const blocks = [
    ['Hot leads', hot.map(g => cardLine(g, g.occasion + ' · ' + (g.interests || []).map(interestLabel).slice(0, 2).join(', ')))],
    ['Event RSVPs · Owner Soirée', rsvps.map(({ g, e }) => cardLine(g, e.status + ' · ' + e.detail))],
    ['Upsells still open', upsells.map(({ g, e }) => cardLine(g, e.title + ' · ' + e.detail))],
    ['Celebrations', celebrations.map(g => cardLine(g, g.occasion + ' · departs ' + prettyDate(g.departure)))]
  ];
  return '<section class="page"><div class="hero slim"><img src="../../dv-photos/pools-1.jpg" alt=""><div class="copy"><p class="kicker">Sales Opportunities</p><h1>Who to follow up today</h1>' +
    '<p>Hot leads, owner interest, excursion upsells, Owner Soirée RSVPs, and celebrations. Local to this iPad until a digest is emailed.</p></div></div>' +
    '<div class="stats">' + counts.map(([n, label]) => '<div class="stat"><b>' + n + '</b>' + esc(label) + '</div>').join('') + '</div>' +
    blocks.map(([title, html]) => '<h2>' + esc(title) + '</h2>' + (html.join('') || '<p class="empty">None.</p>')).join('') +
    '</section>';
}
function cardLine(g, detail) {

function digits(v) { return String(v || '').replace(/\D/g, ''); }
function phoneOK(n) { return n.length >= 7 && n.length <= 15; }
function syncContactFields() {
  const text = document.getElementById('method-text');
  if (!text) return;
  const wa = document.getElementById('method-whatsapp').checked;
  const em = document.getElementById('method-email').checked;
  document.getElementById('phone-block').hidden = !(text.checked || wa);
  document.getElementById('wa-extra').hidden = !wa;
  document.getElementById('wa-num-block').hidden = !wa || document.getElementById('wa-same').checked;
  document.getElementById('email-block').hidden = !em;
}
function nextGuestId(arrival, roomNumber) {
  const [y, m, d] = arrival.split('-');
  const rrrr = String(roomNumber).padStart(4, '0');
  const prefix = 'DLB-' + y.slice(2) + m + d + '-' + rrrr + '-';
  let n = 0;
  db.guests.forEach(g => { if (g.guestId.startsWith(prefix)) n += 1; });
  return { guestId: prefix + String(n + 1).padStart(2, '0'), room: rrrr };
}
function saveGuest() {
  const err = document.getElementById('form-error');
  const name = document.getElementById('guest-name').value.trim();
  const roomNumber = Number(digits(document.getElementById('room').value));
  const arrival = document.getElementById('arrival').value;
  const departure = document.getElementById('departure').value;
  const partySize = Number(document.getElementById('party').value || '1');
  const ownerStatus = (document.querySelector('input[name="owner"]:checked') || {}).value || 'Unknown';
  const occasion = (document.querySelector('input[name="occasion"]:checked') || {}).value || 'None';
  const bestTime = (document.querySelector('input[name="reach"]:checked') || {}).value || 'Anytime';
  const staff = document.getElementById('staff').value.trim().toUpperCase();
  const notes = document.getElementById('notes').value.trim();
  const interests = [...document.querySelectorAll('.tag.on')].map(b => b.dataset.interest);
  const methods = [];
  if (document.getElementById('method-text').checked) methods.push('text');
  if (document.getElementById('method-whatsapp').checked) methods.push('whatsapp');
  if (document.getElementById('method-email').checked) methods.push('email');
  const email = document.getElementById('email').value.trim();
  const problems = [];
  if (!name) problems.push('Enter the guest name.');
  if (!roomNumber || roomNumber > 9999) problems.push('Enter a room number.');
  if (!arrival || !departure || departure < arrival) problems.push('Check the dates.');
  if (!staff) problems.push('Enter your initials.');
  if (!interests.length && occasion === 'None') problems.push('Add an interest or an occasion.');
  if (!methods.length) problems.push('Choose how to reach them.');
  const national = digits(document.getElementById('mobile-number').value);
  const wantPhone = methods.includes('text') || methods.includes('whatsapp');
  if (wantPhone && !phoneOK(national)) problems.push('Enter a mobile number.');
  const waSame = document.getElementById('wa-same').checked;
  const waNational = digits(document.getElementById('wa-number').value);
  if (methods.includes('whatsapp') && !waSame && !phoneOK(waNational)) problems.push('Enter the WhatsApp number or tick same number.');
  if (methods.includes('email') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) problems.push('Enter an email.');
  if (!document.getElementById('consent').checked) problems.push('Confirm we may contact them about the stay.');
  if (problems.length) { err.textContent = problems.join(' '); return; }
  const id = nextGuestId(arrival, roomNumber);
  const mobile = wantPhone ? { cc: document.getElementById('mobile-cc').value, national, display: document.getElementById('mobile-cc').value + ' ' + document.getElementById('mobile-number').value.trim() } : null;
  const whatsapp = methods.includes('whatsapp') && !waSame ? { cc: document.getElementById('wa-cc').value, national: waNational, display: document.getElementById('wa-cc').value + ' ' + document.getElementById('wa-number').value.trim() } : null;
  const now = new Date().toISOString();
  const hotLead = document.getElementById('hot-lead').checked || ownerStatus === 'Owner' || occasion !== 'None';
  const guest = {
    guestId: id.guestId, name, room: id.room, roomNumber, arrival, departure, partySize, ownerStatus,
    occasion, interests, bestTime, hotLead, methods, mobile, whatsappSame: waSame, whatsapp,
    email: methods.includes('email') ? email : '', consent: true, staff, notes, createdAt: now,
    messages: [{ channel: 'in_person', staff, body: 'Registered for Mobile Concierge. Occasion: ' + occasion + '. Interests saved.', at: now }],
    experiences: interests.slice(0, 2).map(i => ({ title: interestLabel(i), detail: 'Suggested from registration', status: 'Suggested' })),
    tickets: []
  };
  if (ownerStatus === 'Owner') {
    guest.experiences.unshift({ title: 'Owner Soirée', detail: SOIREE, status: 'Invited' });
  }
  db.guests.unshift(guest);
  persist();
  maybeSync({ type: 'registration', service: 'Mobile Concierge Registration', guest });
  state.successId = guest.guestId;
  render();
}
function createTicket() {
  const g = guestById(state.guestId);
  const picked = document.querySelector('input[name="pick"]:checked');
  const notes = document.getElementById('req-notes').value.trim();
  const err = document.getElementById('sheet-err');
  if (!picked && !notes) { err.textContent = 'Choose a quick option or add a note.'; return; }
  const summary = picked ? picked.value : notes.split('\n')[0].slice(0, 80);
  const priority = (document.querySelector('input[name="priority"]:checked') || {}).value || 'P3';
  const n = (g.tickets || []).length + 1;
  const ticket = {
    id: 'T' + String(n).padStart(2, '0'),
    lane: state.sheetLane,
    category: state.sheetCat,
    priority, summary, notes,
    status: 'Open',
    smFlag: document.getElementById('sm-flag').checked,
    at: new Date().toISOString()
  };
  ticket.subject = subjectOf(g, ticket);
  g.tickets.push(ticket);
  if (state.sheetLane === 'experience' && !g.experiences.some(e => e.title === summary)) {
    g.experiences.push({ title: summary, detail: notes || 'Added from concierge', status: 'Suggested' });
  }
  g.messages.push({ channel: 'in_person', staff: g.staff, body: 'Request logged: ' + ticket.subject, at: ticket.at });
  persist();
  maybeSync({ type: 'ticket', service: 'Mobile Concierge Registration', guestId: g.guestId, ticket });
  state.sheet = false;
  render();
}
function logMessage(event) {
  event.preventDefault();
  const g = guestById(state.guestId);
  const body = document.getElementById('log-body').value.trim();
  if (!body) return;
  const staff = document.getElementById('log-staff').value.trim().toUpperCase() || g.staff;
  const channel = (document.querySelector('input[name="channel"]:checked') || {}).value || 'in_person';
  g.messages.push({ channel, staff, body, at: new Date().toISOString() });
  persist();
  render();
}
function bind() {
  document.getElementById('nav').querySelectorAll('[data-nav]').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.nav)));
  document.querySelectorAll('[data-open]').forEach(btn => btn.addEventListener('click', () => openGuest(btn.dataset.open)));
  document.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
    const key = btn.dataset.filter;
    if (key === 'all') state.filters = { celebrating: false, owners: false, excursions: false, hot: false, departing: false };
    else state.filters[key] = !state.filters[key];
    render();
  }));
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', () => { state.query = q.value; const pos = q.selectionStart; render(); const again = document.getElementById('q'); if (again) { again.focus(); again.setSelectionRange(pos, pos); } });
  const back = document.getElementById('back-board');
  if (back) back.addEventListener('click', () => setView('board'));
  const nr = document.getElementById('new-request');
  if (nr) nr.addEventListener('click', () => { state.sheet = true; state.sheetCat = 'ACT'; state.sheetLane = 'experience'; render(); });
  const close = document.getElementById('close-sheet');
  if (close) close.addEventListener('click', () => { state.sheet = false; render(); });
  document.querySelectorAll('[data-cat]').forEach(btn => btn.addEventListener('click', () => {
    state.sheetCat = btn.dataset.cat;
    state.sheetLane = btn.dataset.lane;
    render();
  }));
  const create = document.getElementById('create-ticket');
  if (create) create.addEventListener('click', createTicket);
  const composer = document.getElementById('composer');
  if (composer) composer.addEventListener('submit', logMessage);
  document.querySelectorAll('[data-folder]').forEach(btn => btn.addEventListener('click', () => { state.folder = btn.dataset.folder; render(); }));
  document.querySelectorAll('[data-status]').forEach(sel => sel.addEventListener('change', () => {
    const [gid, tid] = sel.dataset.status.split('|');
    const g = guestById(gid);
    const t = g && g.tickets.find(x => x.id === tid);
    if (!t) return;
    t.status = sel.value;
    persist();
    render();
  }));
  ['method-text', 'method-whatsapp', 'method-email', 'wa-same'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', syncContactFields);
  });
  document.querySelectorAll('.tag').forEach(btn => btn.addEventListener('click', () => btn.classList.toggle('on')));
  const save = document.getElementById('save-guest');
  if (save) save.addEventListener('click', saveGuest);
  const openNew = document.getElementById('open-new');
  if (openNew) openNew.addEventListener('click', () => openGuest(state.successId));
  const another = document.getElementById('reg-another');
  if (another) another.addEventListener('click', () => { state.successId = null; render(); });
}
render();

</script>
</body>
</html>
